<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Risk Dashboard 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .risk-extreme { background-color: #7f1d1d; color: white; border-color: #f87171; } /* Deep Red */
        .risk-high { background-color: #ef4444; color: white; border-color: #fca5a5; }    /* Light Red */
        .risk-neutral { background-color: #4b5563; color: white; border-color: #9ca3af; } /* Gray */
        .risk-safe { background-color: #059669; color: white; border-color: #6ee7b7; }    /* Green */
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-width: 2px; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-black text-slate-900 tracking-tight">FINANCIAL RISK <span class="text-red-600">DASHBOARD</span></h1>
            <p class="text-slate-500 mt-2 font-medium">Real-time Market Intelligence Parsing System v2.0</p>
        </header>

        <!-- 1. Input Area -->
        <section class="mb-12 bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
            <div class="flex items-center mb-4 gap-2">
                <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                <h2 class="text-xl font-bold text-slate-800">텍스트 데이터 입력</h2>
            </div>
            <textarea id="inputText" class="w-full h-64 p-5 border-2 border-slate-100 rounded-xl focus:border-blue-500 focus:ring-0 outline-none transition text-sm text-slate-600 leading-relaxed" placeholder="클로드에게 받은 분석 결과 전체를 복사해서 여기에 붙여넣으세요..."></textarea>
            <button onclick="parseAllData()" class="mt-4 w-full bg-slate-900 hover:bg-blue-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                데이터 파싱 및 대시보드 업데이트
            </button>
        </section>

        <!-- 2. Intelligence Section -->
        <div class="flex items-center mb-6 gap-2">
            <div class="w-2 h-6 bg-red-600 rounded-full"></div>
            <h2 class="text-xl font-bold text-slate-800">Intelligence Analysis</h2>
        </div>
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
            <div class="bg-white p-8 rounded-2xl shadow-lg border-l-8 border-blue-600">
                <h3 class="text-blue-600 font-black uppercase tracking-widest text-sm mb-4">US Market Analysis</h3>
                <div id="usIntel" class="text-slate-700 text-sm leading-7 whitespace-pre-wrap">데이터 대기 중...</div>
            </div>
            <div class="bg-white p-8 rounded-2xl shadow-lg border-l-8 border-red-600">
                <h3 class="text-red-600 font-black uppercase tracking-widest text-sm mb-4">KR Market Analysis</h3>
                <div id="krIntel" class="text-slate-700 text-sm leading-7 whitespace-pre-wrap">데이터 대기 중...</div>
            </div>
        </section>

        <!-- 3. Metrics Grid -->
        <div class="flex items-center mb-6 gap-2">
            <div class="w-2 h-6 bg-slate-900 rounded-full"></div>
            <h2 class="text-xl font-bold text-slate-800">지표별 리스크 상태</h2>
        </div>
        <div id="metricsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- 카드가 생성되는 위치 -->
        </div>
    </div>

    <script>
        function getRiskClass(level) {
            if (!level) return 'bg-white text-slate-800 border-slate-200';
            const l = level.replace(/\s/g, '');
            if (l.includes('극도과열')) return 'risk-extreme';
            if (l.includes('과열')) return 'risk-high';
            if (l.includes('중립')) return 'risk-neutral';
            if (l.includes('공포') || l.includes('침체')) return 'risk-safe';
            return 'bg-white text-slate-800 border-slate-200';
        }

        function parseAllData() {
            const text = document.getElementById('inputText').value;
            
            // --- 1. Intelligence 파싱 (강화된 정규식) ---
            const usRegex = /\[미국 시장 종합 분석\]([\s\S]*?)(?=\[한국 시장 종합 분석\]|$)/i;
            const krRegex = /\[한국 시장 종합 분석\]([\s\S]*?)(?=\[Critical Intelligence|$)/i;

            const usMatch = text.match(usRegex);
            const krMatch = text.match(krRegex);

            document.getElementById('usIntel').innerText = usMatch ? usMatch[1].trim() : "데이터 형식이 맞지 않거나 존재하지 않습니다.";
            document.getElementById('krIntel').innerText = krMatch ? krMatch[1].trim() : "데이터 형식이 맞지 않거나 존재하지 않습니다.";

            // --- 2. 지표 카드 파싱 ---
            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = '';

            const metricsList = [
                { id: "버핏 지수", name: "버핏 지수" },
                { id: "선행 PER", name: "선행 PER" },
                { id: "CAPE 지수", name: "CAPE 지수" },
                { id: "CNN 공포/탐욕", name: "CNN Fear & Greed" },
                { id: "VIX 지수", name: "VIX (Volatility)" },
                { id: "하이일드 스프레드", name: "하이일드 스프레드" },
                { id: "국채 금리", name: "미 10년물 금리" },
                { id: "S&P 500 종가", name: "S&P 500" },
                { id: "KOSPI 종가", name: "KOSPI" },
                { id: "KOSPI PBR", name: "KOSPI PBR" },
                { id: "신용융자 잔고", name: "신용융자 잔고" },
                { id: "VKOSPI", name: "VKOSPI (한국)" },
                { id: "투자심리도", name: "투자심리도" }
            ];

            metricsList.forEach((m, idx) => {
                // 수치 추출: "지표: 200%" 또는 "지표: 200 (단위)" 형태 대응
                const valRegex = new RegExp(`${m.id}[^]*?지표:\\s*([^\\n/\\)]+)`, 'i');
                const riskRegex = new RegExp(`${m.id}[^]*?리스크단계:\\s*([^\\n/\\)]+)`, 'i');
                const descRegex = new RegExp(`${m.id}[^]*?지표설명:\\s*([^\\n\\)]+)`, 'i');

                const valMatch = text.match(valRegex);
                const riskMatch = text.match(riskRegex);
                const descMatch = text.match(descRegex);

                const value = valMatch ? valMatch[1].trim() : 'N/A';
                const risk = riskMatch ? riskMatch[1].trim() : '미확인';
                const desc = descMatch ? descMatch[1].trim() : '설명 데이터가 없습니다.';

                const card = document.createElement('div');
                card.className = `card p-6 rounded-2xl shadow-sm border ${getRiskClass(risk)}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-bold opacity-70 tracking-widest uppercase">Metric ${idx + 1}</span>
                        <span class="text-[10px] font-bold bg-black bg-opacity-20 px-2 py-0.5 rounded">${risk}</span>
                    </div>
                    <div class="text-sm font-semibold opacity-90 mb-1">${m.name}</div>
                    <div class="text-3xl font-black mb-4 tracking-tighter">${value}</div>
                    <div class="text-[11px] leading-relaxed opacity-80 font-medium border-t border-white border-opacity-20 pt-3">
                        ${desc}
                    </div>
                `;
                grid.appendChild(card);
            });

            if(text.trim() !== "") {
                window.scrollTo({ top: document.getElementById('usIntel').offsetTop - 50, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
